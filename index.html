<!DOCTYPE html>
<html>
<head>
<title>XAV++ IDE</title>

<style>
body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Consolas, monospace;
    display: flex;
    height: 100vh;
}

/* LEFT PANEL */
#left {
    width: 50%;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* CONTROLS */
#controls {
    padding: 10px;
    background: #111827;
}

button {
    background: #2563eb;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
}

/* RIGHT OUTPUT */
#right {
    width: 50%;
    background: #0a0f1c;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* =========================
   EDITOR CORE FIX (IMPORTANT)
========================= */

#editorWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
}

/* shared layout = PERFECT ALIGNMENT */
#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 20px;

    tab-size: 4;
    white-space: pre;

    box-sizing: border-box;
}

/* INPUT LAYER */
#editorWrap textarea {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;

    z-index: 2;
    overflow: auto;
}

/* HIGHLIGHT LAYER */
#editorWrap pre {
    z-index: 1;
    pointer-events: none;
    overflow: auto;
    color: white;
}

/* SYNTAX COLORS */
.kw { color: #00b7ff; font-weight: bold; }
.str { color: #f4d35e; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ff66c4; }
.mo  { color: #ffb86b; }
.po  { color: #bd93f9; }

</style>
</head>

<body>

<div id="left">

<div id="controls">
    <button onclick="encodeCode()">Encode</button>
    <button onclick="clearOut()">Clear</button>
    <button onclick="copyOutput()">Copy</button>
</div>

<div id="editorWrap">
    <pre id="highlight"></pre>
    <textarea id="editor" oninput="updateHighlight()" onscroll="syncScroll()">print("hello world");</textarea>
</div>

</div>

<div id="right"></div>

<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();

/* =========================
   SYNTAX RULES
========================= */

const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","return","break","continue",
    "var","list","gvar"
];

/* =========================
   HIGHLIGHT ENGINE
========================= */

function escapeHtml(text) {
    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

function highlight(text) {

    text = escapeHtml(text);

    const strings = [];
    const comments = [];

    let s = 0;
    let c = 0;

    /* STRINGS */
    text = text.replace(/"((?:[^"\\]|\\.)*)"/g, m => {
        strings.push(m);
        return `__STR${s++}__`;
    });

    text = text.replace(/'((?:[^'\\]|\\.)*)'/g, m => {
        strings.push(m);
        return `__STR${s++}__`;
    });

    /* COMMENTS */
    text = text.replace(/\/\*[\s\S]*?\*\//g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    text = text.replace(/\/\/.*/g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    /* POLYMOD: obj.method() */
    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m, obj, method) =>
            `<span class="po">${obj}</span>.<span class="po">${method}</span>(`
    );

    /* MONOMOD: obj.prop */
    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
        (m, obj, prop) =>
            `<span class="mo">${obj}</span>.<span class="mo">${prop}</span>`
    );

    /* FUNCTION CALLS */
    text = text.replace(
        /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m, name) => {
            if (KEYWORDS.includes(name)) return m;
            return `<span class="fn">${name}</span>(`;
        }
    );

    /* KEYWORDS */
    for (const kw of KEYWORDS) {
        text = text.replace(
            new RegExp("\\b" + kw + "\\b","g"),
            `<span class="kw">${kw}</span>`
        );
    }

    /* NUMBERS */
    text = text.replace(/\b\d+\b/g, m => `<span class="num">${m}</span>`);

    /* RESTORE COMMENTS */
    text = text.replace(/__COM(\d+)__/g, (m,i) =>
        `<span class="com">${comments[i]}</span>`
    );

    /* RESTORE STRINGS */
    text = text.replace(/__STR(\d+)__/g, (m,i) =>
        `<span class="str">${strings[i]}</span>`
    );

    return text;
}

/* =========================
   UI SYNC
========================= */

function updateHighlight() {
    const ed = document.getElementById("editor");
    const hl = document.getElementById("highlight");
    hl.innerHTML = highlight(ed.value);
}

function syncScroll() {
    const ed = document.getElementById("editor");
    const hl = document.getElementById("highlight");

    hl.scrollTop = ed.scrollTop;
    hl.scrollLeft = ed.scrollLeft;
}

/* =========================
   IDE ACTIONS
========================= */

function encodeCode() {
    const input = document.getElementById("editor").value;
    const encoded = codec.encodeLines(input);
    document.getElementById("right").textContent = encoded;
}

function clearOut() {
    document.getElementById("right").textContent = "";
}

function copyOutput() {
    const output = document.getElementById("right").textContent;
    if (!output) return;
    navigator.clipboard.writeText(output);
}

/* INIT */
updateHighlight();
</script>

</body>
</html>
