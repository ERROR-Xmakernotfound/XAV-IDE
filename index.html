<!--
const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
-->
<!DOCTYPE html>
<html>
<head>
<title>XAV++ IDE</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon.png">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #0f172a;
    color: white;
    font-family: Consolas, monospace;
}

/* LEFT = BIGGEST AREA */
#left {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* OUTPUT = SMALLER */
#right {
    flex: 2;
    background: #0a0f1c;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* FLOATING RUNTIME */
#runtime {
    position: fixed;
    bottom: 10px;
    right: 10px;

    width: 700px;
    height: 600px;

    background: #000;
    border: 2px solid #1f2937;
    border-radius: 8px;

    overflow: hidden;
    z-index: 9999;
}

#runtime iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* controls */
#controls {
    padding: 10px;
    background: #111827;
}

button {
    background: #2563eb;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
}

/* editor */
#editorWrap {
    position: relative;
    flex: 1;
}

#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 20px;

    white-space: pre;
    tab-size: 4;
    box-sizing: border-box;
}

#editorWrap textarea {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;
}

#highlight {
    z-index: 1;
    pointer-events: none;
    overflow: auto;
}

/* syntax */
.kw { color: #77b7ff; font-weight: bold; }
.str { color: #55aa55; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ffaa55; }
.mo  { color: #ffb86b; }
.po  { color: #bd93f9; }
.bool { color: #ee2222; font-weight: bold; }
.builtin {color: #66ffcc; font-weight: bold;}

</style>
</head>

<body>

<!-- EDITOR -->
<div id="left">
    <div id="controls">
        <button onclick="clearOut()">Clear</button>
        <button onclick="encodeCode();copyOutput();alert('encoded output copied!');">Encode and Copy</button>
    </div>

    <div id="editorWrap">
        <pre id="highlight"></pre>
        <textarea id="editor">print("hello world");</textarea>
    </div>

</div>

<!-- OUTPUT -->
<div id="right"></div>

<!-- FLOATING RUNTIME -->
<div id="runtime">
    <iframe src="https://turbowarp.org/1297244237/embed"
        allowfullscreen>
    </iframe>
</div>


<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();

const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
const BUILTINS = [
    "$mouse_x",
    "$mouse_y",
    "$answer",
    "$x_pos",
    "$y_pos",
    "$direction",
    "$CloneID",
    "$input#",
    "$returned",
    "$namespace",
    "$in#",
    "$is_pressed",
];

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}
function highlight(text, bracketA = -1, bracketB = -1) {

    const original = text;

    text = escapeHtml(text);

    const strings = [];
    const comments = [];

    let s = 0, c = 0;

    function visualizeIndent(text) {
        return text.replace(/^( +)/gm, (m) => {
            return m.replace(/ /g, "·");
        });
    }
    

    text = text.replace(/"((?:[^"\/]|\/["\/])*)"/g, (m) => {
    strings.push(m);
    return `__STR${s++}__`;
});

text = text.replace(/'((?:[^'\/]|\/["\/])*)'/g, (m) => {
    strings.push(m);
    return `__STR${s++}__`;
});

    text = text.replace(/\/\*[\s\S]*?\*\//g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    text = text.replace(/\/\/.*/g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });
       text = text.replace(
		/\$[a-zA-Z_][a-zA-Z0-9_]*/g,
		(match) => `<span class="builtin">${match}</span>`
	);

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m,o,mth) => `<span class="po">${o}</span>.<span class="po">${mth}</span>(`
    );

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
        (m,o,p) => `<span class="mo">${o}</span>.<span class="mo">${p}</span>`
    );

    text = text.replace(
        /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m,n) => KEYWORDS.includes(n)
            ? m
            : `<span class="fn">${n}</span>(`
    );

    for (const kw of KEYWORDS) {
        text = text.replace(
            new RegExp("\\b"+kw+"\\b","g"),
            `<span class="kw">${kw}</span>`
        );
    }
    text = text.replace(
        /\b\d+\b/g,
        m => `<span class="num">${m}</span>`
    );

    text = text.replace(
        /\b(true|false)\b/g,
        m => `<span class="bool">${m}</span>`
    );

    text = text.replace(/__COM(\d+)__/g,(m,i)=>
        `<span class="com">${comments[i]}</span>`
    );

    text = text.replace(/__STR(\d+)__/g,(m,i)=>
        `<span class="str">${strings[i]}</span>`
    );

    text = visualizeIndent(text);



    return text;
}
/* UI */
const editor = document.getElementById("editor");
editor.addEventListener("keydown", (e) => {
    const TAB_SIZE = 4;

    if (e.key === "Tab") {
        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const spaces = " ".repeat(TAB_SIZE);

        editor.value =
            editor.value.substring(0, start) +
            spaces +
            editor.value.substring(end);

        editor.selectionStart = editor.selectionEnd = start + TAB_SIZE;

        updateHighlight();
    }

    if (e.key === "Backspace") {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        // only run when no selection
        if (start === end) {
            const before = editor.value.substring(0, start);

            // check last 4 characters
            if (before.endsWith(" ".repeat(4))) {
                e.preventDefault();

                editor.value =
                    editor.value.substring(0, start - 4) +
                    editor.value.substring(end);

                editor.selectionStart = editor.selectionEnd = start - 4;

                updateHighlight();
            }
        }

        updateHighlight();
    }
});
function updateHighlight() {
    document.getElementById("highlight").innerHTML =
        highlight(editor.value);
}
editor.addEventListener("input", updateHighlight);

/* buttons */
window.encodeCode = function () {
    document.getElementById("right").textContent =
        codec.encodeLines(document.getElementById("editor").value);
};

window.clearOut = () =>
    document.getElementById("right").textContent = "";

window.copyOutput = () =>
    navigator.clipboard.writeText(
        document.getElementById("right").textContent
    );

updateHighlight();
</script>

</body>
</html>
