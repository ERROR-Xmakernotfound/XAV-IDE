<!--
const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
-->
<!DOCTYPE html>
<html>
<head>
<title>XAV++ IDE</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon.png">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #0f172a;
    color: white;
    font-family: Consolas, monospace;
}

/* LEFT PANEL */
#left {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* OUTPUT PANEL */
#right {
    flex: 2;
    background: #0a0f1c;
    color: #000000;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* FLOATING RUNTIME */
#runtime {
    position: fixed;
    bottom: 5px;
    right: 10px;

    width: 637px;
    height: 600px;

    background: #000;
    border: 2px solid #1f2937;
    border-radius: 8px;

    overflow: hidden;
    z-index: 9999;
}

#runtime iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* CONTROLS */
#controls {
    padding: 12px 12px;
    margin: 10px 10px 6px 10px;
    background: #252947;
    border-radius: 6px;
    border-bottom: 4px solid #5f5957;
}
#editorMask {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 12px;

    background: #111827;
    z-index: 5;

    pointer-events: none;
}
button {
    background: #2563eb;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
}

/* EDITOR WRAPPER */
#editorWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
}
#editorContainer {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
}

#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 20px;

    tab-size: 4;
    box-sizing: border-box;

    white-space: pre;   /* MUST be identical */
    overflow-wrap: normal;
    word-wrap: normal;
}

/* INPUT LAYER */
#editor {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;

    overflow: auto;
    white-space: pre;   /* MUST match highlight exactly */
}

/* OUTPUT LAYER */
#highlight {
    z-index: 1;
    pointer-events: none;

    overflow: hidden;
    white-space: pre;   /* CRITICAL FIX */
}

/* FULL SIZE LOCK */
#editor,
#highlight {
    width: 100%;
    height: 100%;
}
#highlight {
    z-index: 1;
    pointer-events: none;

    white-space: pre;
    overflow: visible;

    will-change: transform;
}

/* SYNTAX COLORS */
.kw { color: #77b7ff; font-weight: bold; }
.str { color: #55aa55; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ffaa55; }
.mo  { color: #ffb86b; }
.po  { color: #bd93f9; }
.bool { color: #ee2222; font-weight: bold; }
.builtin { color: #66ffcc; font-weight: bold; }
.err { background: rgba(255,0,0,0.18); border-bottom: 2px solid #ff4444; }
.paren { color: #ffffff; }
</style>
</head>

<body>

<!-- EDITOR -->
<div id="left">

    <div id="controls">
        <button onclick="clearOut()">Clear</button>
        <button onclick="encodeCode();copyOutput();alert('encoded output copied!');">
            Encode and Copy
        </button>
    </div>

    <div id="editorWrap">
        <div id="editorMask"></div>

        <pre id="highlight"></pre>
        <textarea id="editor">print("hello world");</textarea>
    </div>

</div>

<!-- OUTPUT -->
<div id="right"></div>

<!-- FLOATING RUNTIME -->
<div id="runtime">
    <iframe src="https://turbowarp.org/1297244237/embed"
        allowfullscreen>
    </iframe>
</div>


<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();

const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
const BUILTINS = [
    "$mouse_x",
    "$mouse_y",
    "$answer",
    "$x_pos",
    "$y_pos",
    "$direction",
    "$CloneID",
    "$input#",
    "$returned",
    "$namespace",
    "$in#",
    "$is_pressed",
];

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}
function analyzeErrors(text) {

    const errors = [];

    const stack = [];

    const pairs = {
        "(": ")",
        "{": "}",
        "[": "]"
    };

    let inString = false;
    let stringStart = -1;

    // =========================
    // BRACKET + STRING CHECKING
    // =========================

    for (let i = 0; i < text.length; i++) {

        const ch = text[i];
        const next = text[i + 1];

        // XAV++ escapes:
        // /" = literal "
        // // = literal /
        if (ch === "/" && (next === '"' || next === "/")) {
            i++;
            continue;
        }

        // STRING HANDLING
        if (ch === '"') {

            if (!inString) {
                inString = true;
                stringStart = i;
            } else {
                inString = false;
            }

            continue;
        }

        // ignore syntax inside strings
        if (inString) continue;

        // OPENING BRACKETS
        if (pairs[ch]) {

            stack.push({
                char: ch,
                pos: i
            });

            continue;
        }

        // CLOSING BRACKETS
        if (Object.values(pairs).includes(ch)) {

            const last = stack.pop();

            // nothing to match
            if (!last) {

                errors.push({
                    type: "bracket",
                    pos: i,
                    length: 1,
                    msg: `Unexpected '${ch}'`
                });

                continue;
            }

            // wrong bracket type
            if (pairs[last.char] !== ch) {

                errors.push({
                    type: "bracket",
                    pos: i,
                    length: 1,
                    msg: `Expected '${pairs[last.char]}' but got '${ch}'`
                });
            }
        }
    }

    // UNCLOSED BRACKETS
    for (const item of stack) {

        errors.push({
            type: "bracket",
            pos: item.pos,
            length: 1,
            msg: `Unclosed '${item.char}'`
        });
    }

    // UNCLOSED STRING
    if (inString) {

        errors.push({
            type: "string",
            pos: stringStart,
            length: 1,
            msg: "Unclosed string"
        });
    }

    // =========================
    // SEMICOLON CHECKING
    // =========================

    const lines = text.split("\n");

    let currentPos = 0;
    let blockDepth = 0;

    lines.forEach((line) => {

        const t = line.trim();

        // skip blank lines
        if (!t) {
            currentPos += line.length + 1;
            return;
        }

        // skip single-line comments
        if (t.startsWith("//")) {
            currentPos += line.length + 1;
            return;
        }

        // skip multiline comment markers
        if (
            t.startsWith("/*") ||
            t.endsWith("*/")
        ) {
            currentPos += line.length + 1;
            return;
        }

        // count blocks
        for (const ch of line) {

            if (ch === "{") blockDepth++;
            if (ch === "}") blockDepth--;
        }

        // opening block line
        const opensBlock = t.endsWith("{");

        // only require semicolon
        // if not mid-block
        if (!opensBlock && blockDepth <= 0) {

            if (!t.endsWith(";")) {

                errors.push({
                    type: "semicolon",
                    pos: currentPos + line.length - 1,
                    length: 1,
                    msg: "Missing semicolon"
                });
            }
        }

        currentPos += line.length + 1;
    });

    return errors;
}
function highlight(text, bracketA = -1, bracketB = -1) {

    const original = text;

    text = escapeHtml(text);

    const strings = [];
    const comments = [];

    let s = 0, c = 0;
    

    text = text.replace(/"((?:[^"\/]|\/["\/])*)"/g, (m) => {
    strings.push(m);
    return `__STR${s++}__`;
});

text = text.replace(/'((?:[^'\/]|\/["\/])*)'/g, (m) => {
    strings.push(m);
    return `__STR${s++}__`;
});

    text = text.replace(/\/\*[\s\S]*?\*\//g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    text = text.replace(/\/\/.*/g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });
       text = text.replace(
		/\$[a-zA-Z_][a-zA-Z0-9_]*/g,
		(match) => `<span class="builtin">${match}</span>`
	);

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m,o,mth) => `<span class="po">${o}</span>.<span class="po">${mth}</span>(`
    );

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
        (m,o,p) => `<span class="mo">${o}</span>.<span class="mo">${p}</span>`
    );

text = text.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\(/g,
    (m, name) => {
        if (KEYWORDS.includes(name)) return m;

        return `<span class="fn">${name}</span><span class="po">(</span>`;
    }
);

    for (const kw of KEYWORDS) {
        text = text.replace(
            new RegExp("\\b"+kw+"\\b","g"),
            `<span class="kw">${kw}</span>`
        );
    }
    text = text.replace(
        /\b\d+\b/g,
        m => `<span class="num">${m}</span>`
    );

    text = text.replace(
        /\b(true|false)\b/g,
        m => `<span class="bool">${m}</span>`
    );

    text = text.replace(/__COM(\d+)__/g,(m,i)=>
        `<span class="com">${comments[i]}</span>`
    );

    text = text.replace(/__STR(\d+)__/g,(m,i)=>
        `<span class="str">${strings[i]}</span>`
    );

text = text.replace(/\(/g, `<span class="paren">(</span>`);
text = text.replace(/\)/g, `<span class="paren">)</span>`);

const errors = analyzeErrors(original);
let errorIndex = 0;

let result = "";
let rawIndex = 0;

for (let i = 0; i < text.length; i++) {

    const char = text[i];

    // Skip HTML tags
    if (char === "<") {

        while (i < text.length && text[i] !== ">") {
            result += text[i];
            i++;
        }

        result += ">";
        continue;
    }

    // Skip HTML entities like &lt;
    if (char === "&") {

        let entity = char;

        while (i + 1 < text.length && text[i + 1] !== ";") {
            i++;
            entity += text[i];
        }

        if (i + 1 < text.length) {
            i++;
            entity += text[i];
        }

        const err = errors.find(e =>
            rawIndex >= e.pos &&
            rawIndex < e.pos + e.length
        );

        if (err) {
            result += `<span class="err">${entity}</span>`;
        } else {
            result += entity;
        }

        rawIndex++;
        continue;
    }

    const err = errors.find(e =>
        rawIndex >= e.pos &&
        rawIndex < e.pos + e.length
    );

    if (err) {
        result += `<span class="err">${char}</span>`;
    } else {
        result += char;
    }

    rawIndex++;
}
text = text.replace(/(^|\n)(?=\n)/g, "$1\u200B");
text = result.split("\n").map(line => {
    if (line === "") return "<div></div>";
    return line;
}).join("\n");
text = result;
return text;
}
const editor = document.getElementById("editor");
const highlightBox = document.getElementById("highlight");

editor.addEventListener("scroll", () => {
    highlightBox.style.transform =
        `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
});
editor.addEventListener("keydown", (e) => {

    const TAB_SIZE = 4;

    // =====================
    // TAB
    // =====================

    if (e.key === "Tab") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const spaces = " ".repeat(TAB_SIZE);

        editor.value =
            editor.value.substring(0, start) +
            spaces +
            editor.value.substring(end);

        editor.selectionStart =
        editor.selectionEnd =
            start + TAB_SIZE;

        updateHighlight();
    }

    // =====================
    // BACKSPACE TAB DELETE
    // =====================

    if (e.key === "Backspace") {

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        if (start === end) {

            const before =
                editor.value.substring(0, start);

            if (
                before.endsWith(
                    " ".repeat(TAB_SIZE)
                )
            ) {

                e.preventDefault();

                editor.value =
                    editor.value.substring(0, start - TAB_SIZE) +
                    editor.value.substring(end);

                editor.selectionStart =
                editor.selectionEnd =
                    start - TAB_SIZE;

                updateHighlight();
            }
        }
    }

    // =====================
    // AUTO INDENT
    // =====================

    if (e.key === "Enter") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const beforeCursor =
            editor.value.substring(0, start);

        const lineStart =
            beforeCursor.lastIndexOf("\n") + 1;

        const currentLine =
            beforeCursor.substring(lineStart);

        // existing indent
        const indent =
            currentLine.match(/^ */)[0];

        // add extra indent after {
        let extra = "";

        if (currentLine.trim().endsWith("{")) {

            extra =
                " ".repeat(TAB_SIZE);
        }

        const insert =
            "\n" + indent + extra;

        editor.value =
            editor.value.substring(0, start) +
            insert +
            editor.value.substring(end);

        const newPos =
            start + insert.length;

        editor.selectionStart =
        editor.selectionEnd =
            newPos;

        updateHighlight();
    }
});
function updateHighlight() {
    highlightBox.innerHTML =
    highlight(editor.value);
}
editor.addEventListener("input", updateHighlight);

/* buttons */
window.encodeCode = function () {
    document.getElementById("right").textContent =
        codec.encodeLines(document.getElementById("editor").value);
};

window.clearOut = () =>
    document.getElementById("right").textContent = "";

window.copyOutput = () =>
    navigator.clipboard.writeText(
        document.getElementById("right").textContent
    );

updateHighlight();
</script>

</body>
</html>
