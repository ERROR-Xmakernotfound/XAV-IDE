<!--
const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
-->
<!DOCTYPE html>
<html>
<head>
<title>XAV IDE</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #1C1C1C;
    color: white;
    font-family: "JetBrains Mono";
}

/* LEFT PANEL */
#left {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* OUTPUT PANEL */
#right {
    flex: 2;
    background: #0a0f1c;
    color: #000000;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* FLOATING RUNTIME */
#runtime {
    position: fixed;
    bottom: 0px;
    right: 0px;

    width: 645px;
    height: 600px;

    background: #000;
    border: 2px solid #1f2937;
    border-radius: 8px;

    overflow: hidden;
    z-index: 9999;
}

#runtime iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* CONTROLS */
#controls {
    padding: 12px 12px;
    margin: 10px 10px 6px 10px;
    background: #271118;
    border-radius: 6px;
    border-bottom: 4px solid #5f5957;
}
#editorMask {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 12px;

    background: #1C1C1C;
    z-index: 5;

    pointer-events: none;
}
button {
    background: #eb2311;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
    font-family: "JetBrains Mono";
}

/* EDITOR WRAPPER */
#editorWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
}
#editorContainer {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
}

#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: "JetBrains Mono";
    font-size: 14px;
    line-height: 20px;

    tab-size: 4;
    box-sizing: border-box;

    white-space: pre;   /* MUST be identical */
    overflow-wrap: normal;
    word-wrap: normal;
}

/* INPUT LAYER */
#editor {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;

    overflow: auto;
    white-space: pre;   /* MUST match highlight exactly */
}

/* OUTPUT LAYER */
#highlight {
    z-index: 1;
    pointer-events: none;

    overflow: hidden;
    white-space: pre;   /* CRITICAL FIX */
}

/* FULL SIZE LOCK */
#editor,
#highlight {
    width: 100%;
    height: 100%;
}
#highlight {
    z-index: 1;
    pointer-events: none;

    white-space: pre;
    overflow: visible;

    will-change: transform;
}

/* SYNTAX COLORS */
.kw { color: #DD5555; font-weight: bold; }
.str { color: #55aa55; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ff6611; }
.mo  { color: #ff5500; }
.po  { color: #aa55ff; }
.op  { color: #ffaa00; }
.var  { color: #ff6600; }
.bool { color: #ee2222; font-weight: bold; }
.builtin { color: #00ccff; font-weight: bold; }
.identifier { color: #80B8FF; font-weight: bold; }
.err { background: rgba(255,0,0,0.18); border-bottom: 2px solid #ff4444; }
.paren { color: #ffffff; }

.indent {color: #ffffff;}

.indent-major {color: #ffffff;}
</style>
</head>

<body>

<!-- EDITOR -->
<div id="left">

    <div id="controls">
        <button onclick="clearOut()">Clear</button>
        <button onclick="encodeCode();copyOutput();alert('encoded output copied!');">
            Encode and Copy
        </button>
        <button onclick="importEncoded()">Import XAV bin</button>
        <button onclick="exportEncoded()">Export XAV bin</button>
        <button onclick="toggleXAVMode()">XAV++/XAV-- Mode</button>
    </div>

    <div id="editorWrap">
        <div id="editorMask"></div>

        <pre id="highlight"></pre>
        <textarea id="editor">print("hello world");</textarea>
    </div>

</div>
<input
    type="file"
    id="encodedFileInput"
    accept=".xavbin"
    style="display:none;"
>
<!-- OUTPUT -->
<div id="right"></div>

<!-- FLOATING RUNTIME -->
<div id="runtime">
    <iframe src="https://turbowarp.org/1297244237/embed"
        allowfullscreen>
    </iframe>
</div>


<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();
window.isXAVMinus = false;
window.xavMode = "XAV++";

window.toggleXAVMode = function () {

    window.xavMode =
        window.xavMode === "XAV++" ? "XAV--" : "XAV++";

    updateHighlight();

    const id = RUNTIME_PROJECTS[window.xavMode];

    runtimeFrame.src =
        "https://turbowarp.org/" + id + "/embed";
if (window.xavMode === "XAV++") {
alert("XAV++ Mode active!");
} else if (window.xavMode == "XAV--"){
alert("XAV-- Mode active!");
}

    console.log(runtimeFrame.src);
};
const KEYWORDS_XAVPP = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","output","link"
];
const KEYWORDS_XAVMM = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "local","global","array","omnipresent","output","link",
    "inherit","mutate"
];
const BUILTINS = [
    "$mouse_x",
    "$mouse_y",
    "$answer",
    "$x_pos",
    "$y_pos",
    "$direction",
    "$CloneID",
    "$input#",
    "$returned",
    "$namespace",
    "$in#",
    "$is_pressed",
];
const RUNTIME_PROJECTS = {
    "XAV++": "1297244237",
    "XAV--": "1330755400"
};
function getKeywordsActive() {
    return window.xavMode === "XAV--"
        ? KEYWORDS_XAVMM
        : KEYWORDS_XAVPP;
}
const runtimeFrame = document.querySelector("#runtime iframe");

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}
function highlight(text) {

    let result = "";
    let i = 0;

    let inString = false;
    let stringChar = null;

    let inLineComment = false;
    let inBlockComment = false;
    
const KEYWORDS_ACTIVE =
    window.isXAVMinus ? KEYWORDS_XAVMM : KEYWORDS_XAVPP;

const isKeyword = (w) => getKeywordsActive().includes(w);

    let buffer = "";

    function flushBuffer() {

        if (!buffer) return;

        let out = buffer;

        if (/^\d+$/.test(out)) {
            result += `<span class="num">${out}</span>`;
        }

        else if (/^\$[a-zA-Z_][a-zA-Z0-9_]*$/.test(out)) {
            result += `<span class="builtin">${out}</span>`;
        }
        else if (out === "true" || out === "false" || out === "null") {
    result += `<span class="bool">${out}</span>`;
}

        else if (isKeyword(out)) {
            result += `<span class="kw">${out}</span>`;
        }

        else {
            result += escapeHtml(out);
        }

        buffer = "";
    }

    while (i < text.length) {

        const ch = text[i];
        const next = text[i + 1];
        

        // =========================================================
        // IMPORTANT FIX: COMMENT MODE OVERRIDES EVERYTHING
        // =========================================================

if (inLineComment) {

    if (ch === "\n") {

        result += "\n";   // keep newline plain

        inLineComment = false;
        i++;
        continue;
    }

    result += `<span class="com">${escapeHtml(ch)}</span>`;

    i++;
    continue;
}

        if (inBlockComment) {

            if (ch === "*" && next === "/") {
                result += `<span class="com">*/</span>`;
                inBlockComment = false;
                i += 2;
                continue;
            }

            result += `<span class="com">${escapeHtml(ch)}</span>`;
            i++;
            continue;
        }

        // =========================================================
        // STRING MODE (ONLY IF NOT IN COMMENT)
        // =========================================================

if (inString) {

	// XAV++ escapes
	if (
		ch === "/" &&
		(next === '"' || next === "/")
	) {

		result +=
			`<span class="str">${escapeHtml(ch + next)}</span>`;

		i += 2;
		continue;
	}

	result += `<span class="str">${escapeHtml(ch)}</span>`;

	if (ch === stringChar) {
		inString = false;
		stringChar = null;
	}

	i++;
	continue;
}

        // =========================================================
        // START COMMENT (highest priority)
        // =========================================================

        if (ch === "/" && next === "/") {
            flushBuffer();
            inLineComment = true;
            result += `<span class="com">//</span>`;
            i += 2;
            continue;
        }

        if (ch === "/" && next === "*") {
            flushBuffer();
            inBlockComment = true;
            result += `<span class="com">/*</span>`;
            i += 2;
            continue;
        }
        

        // =========================================================
        // START STRING
        // =========================================================

        if (ch === '"' || ch === "'") {
            flushBuffer();
            inString = true;
            stringChar = ch;
            result += `<span class="str">${ch}</span>`;
            i++;
            continue;
        }
                // =========================
        // BUILTINS ($variables)
        // =========================

        if (ch === "$") {

            flushBuffer(); // important: don't mix with words

            let start = i;
            let name = "$";
            i++;

            while (i < text.length &&
                   /[a-zA-Z0-9_#]/.test(text[i])) {
                name += text[i];
                i++;
            }

            result += `<span class="builtin">${escapeHtml(name)}</span>`;
            continue;
        }

        // =========================================================
        // WORDS (keywords, functions, builtins)
        // =========================================================

        if (/[a-zA-Z_]/.test(ch)) {

            buffer += ch;
            i++;

            while (i < text.length &&
                   /[a-zA-Z0-9_$]/.test(text[i])) {
                buffer += text[i];
                i++;
            }

// function detection
const start = i - buffer.length;

if (
	text[i] === "(" &&
	!isKeyword(buffer)
) {

	let j = start - 1;

	while (j >= 0 && /\s/.test(text[j])) {
		j--;
	}

	if (j >= 0 && text[j] === ".") {

		result += `<span class="po">${buffer}</span>`;

		buffer = "";
		continue;
	}

	result += `<span class="fn">${buffer}</span>`;

	buffer = "";
	continue;
}

            flushBuffer();
            continue;
        }

        // =========================================================
        // NUMBERS
        // =========================================================

        if (/\d/.test(ch)) {

            buffer += ch;
            i++;

            while (i < text.length && /\d/.test(text[i])) {
                buffer += text[i];
                i++;
            }

            flushBuffer();
            continue;
        }
        

        // =========================================================
        // PARENTHESIS
        // =========================================================

        if (ch === "(" || ch === ")") {
            flushBuffer();
            result += `<span class="paren">${ch}</span>`;
            i++;
            continue;
        }

        // =========================================================
        // DEFAULT CHARACTER
        // =========================================================

        flushBuffer();
        result += escapeHtml(ch);
        i++;
    }

    flushBuffer();
// =========================
// DOT SYSTEM (SAFE VERSION)
// =========================

// protect existing spans first
const spans = [];
let s = 0;

result = result.replace(/<span[^>]*>.*?<\/span>/g, m => {
    spans.push(m);
    return `__SPAN${s++}__`;
});

// -------------------------
// MONO SECOND
// -------------------------
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
    (m, obj, prop) => {
        return `<span class="mo">${obj}.${prop}</span>`;
    }
);
// -------------------------
// POLY FIRST
// -------------------------
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
    (m, obj, prop) => {
        return `<span class="po">${obj}.${prop}</span><span class="paren">(</span>`;
    }
);
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*(=|append)\s*(.+?);/g,
    (m, name, op, value) => {

        return (
            `<span class="identifier">${name}</span> ` +
            `<span class="op">${op}</span> ` +
            `${value};`
        );
    }
);
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\s+([a-zA-Z_][a-zA-Z0-9_$#]*)\s*;/g,
    (m, cmd, arg) => {

        // avoid breaking already-highlighted HTML
        if (m.includes("<span")) return m;

        return (
            `<span class="identifier">${cmd}</span> ` +
            `<span class="var">${arg}</span>;`
        );
    }
);
result = result.replace(
    /^( +)/gm,
    (match) => {

        let out = "";

        for (let i = 0; i < match.length; i++) {

            if ((i + 1) % 4 === 0) {
                out += '<span class="indent indent-major">|</span>';
            } else {
                out += '<span class="indent"> </span>';
            }
        }

        return out;
    }
);
// restore spans
result = result.replace(/__SPAN(\d+)__/g, (m, i) => spans[i]);
    return result;
}
const editor = document.getElementById("editor");
const highlightBox = document.getElementById("highlight");
editor.addEventListener("scroll", () => {
    highlightBox.style.transform =
        `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
});
editor.addEventListener("keydown", (e) => {

    const TAB_SIZE = 4;

    // =====================
    // TAB
    // =====================

    if (e.key === "Tab") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const spaces = " ".repeat(TAB_SIZE);

        editor.value =
            editor.value.substring(0, start) +
            spaces +
            editor.value.substring(end);

        editor.selectionStart =
        editor.selectionEnd =
            start + TAB_SIZE;

        updateHighlight();
    }

    // =====================
    // BACKSPACE TAB DELETE
    // =====================

    if (e.key === "Backspace") {

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        if (start === end) {

            const before =
                editor.value.substring(0, start);

            if (
                before.endsWith(
                    " ".repeat(TAB_SIZE)
                )
            ) {

                e.preventDefault();

                editor.value =
                    editor.value.substring(0, start - TAB_SIZE) +
                    editor.value.substring(end);

                editor.selectionStart =
                editor.selectionEnd =
                    start - TAB_SIZE;

                updateHighlight();
            }
        }
    }

    // =====================
    // AUTO INDENT
    // =====================

    if (e.key === "Enter") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const beforeCursor =
            editor.value.substring(0, start);

        const lineStart =
            beforeCursor.lastIndexOf("\n") + 1;

        const currentLine =
            beforeCursor.substring(lineStart);

        // existing indent
        const indent =
            currentLine.match(/^ */)[0];

        // add extra indent after {
        let extra = "";

        if (currentLine.trim().endsWith("{")) {

            extra =
                " ".repeat(TAB_SIZE);
        }

        const insert =
            "\n" + indent + extra;

        editor.value =
            editor.value.substring(0, start) +
            insert +
            editor.value.substring(end);

        const newPos =
            start + insert.length;

        editor.selectionStart =
        editor.selectionEnd =
            newPos;

        updateHighlight();
    }
});
function updateHighlight() {
    highlightBox.innerHTML =
    highlight(editor.value);
}
editor.addEventListener("input", updateHighlight);

/* buttons */
window.encodeCode = function () {
    document.getElementById("right").textContent =
        codec.encodeLines(document.getElementById("editor").value);
};
window.exportEncoded = function () {

    let name = prompt("Enter file name:", "source");

    if (!name) return;

    const encoded = codec.encodeLines(editor.value);

    const blob = new Blob([encoded], { type: "text/plain" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = name + ".xavbin";
    a.click();

    URL.revokeObjectURL(url);
};
// =========================
// IMPORT XAV BIN
// =========================

window.importEncoded = function () {

	const input = document.createElement("input");

	input.type = "file";
	input.accept = ".xavbin";

	input.onchange = function (e) {

		const file = e.target.files[0];

		if (!file) return;

		const reader = new FileReader();

		reader.onload = function () {

			try {

				const encoded = reader.result;

				const decoded =
					codec.decodeLines(encoded);

				editor.value = decoded;

				updateHighlight();

			} catch (err) {

				console.error(err);

				alert(
					"Failed to import XAV binary."
				);
			}
		};

		reader.readAsText(file);
	};

	input.click();
};
window.clearOut = () =>
    document.getElementById("right").textContent = "";

window.copyOutput = () =>
    navigator.clipboard.writeText(
        document.getElementById("right").textContent
    );

updateHighlight();
</script>

</body>
</html>
