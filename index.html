<!DOCTYPE html>
<html>
<head>
<title>XAV++ IDE</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #0f172a;
    color: white;
    font-family: Consolas, monospace;
}

/* LEFT = BIGGEST AREA */
#left {
    flex: 2;              /* 👈 makes it dominant */
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* OUTPUT = SMALLER */
#right {
    flex: 2;              /* 👈 smaller than editor */
    background: #0a0f1c;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* FLOATING RUNTIME */
#runtime {
    position: fixed;
    bottom: 10px;
    right: 10px;

    width: 700px;
    height: 600px;

    background: #000;
    border: 2px solid #1f2937;
    border-radius: 8px;

    overflow: hidden;
    z-index: 9999;
}

#runtime iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* controls */
#controls {
    padding: 10px;
    background: #111827;
}

button {
    background: #2563eb;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
}

/* editor */
#editorWrap {
    position: relative;
    flex: 1;
}

#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 20px;

    white-space: pre;
    tab-size: 4;
    box-sizing: border-box;
}

#editorWrap textarea {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;
}

#highlight {
    z-index: 1;
    pointer-events: none;
    overflow: auto;
}

/* syntax */
.kw { color: #00b7ff; font-weight: bold; }
.str { color: #f4d35e; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ff66c4; }
.mo  { color: #ffb86b; }
.po  { color: #bd93f9; }

</style>
</head>

<body>

<!-- EDITOR -->
<div id="left">
    <div id="controls">
        <button onclick="clearOut()">Clear</button>
        <button onclick="encodeCode();copyOutput();alert('encoded output copied!');">Encode and Copy</button>
    </div>

    <div id="editorWrap">
        <pre id="highlight"></pre>
        <textarea id="editor">print("hello world");</textarea>
    </div>

</div>

<!-- OUTPUT -->
<div id="right"></div>

<!-- FLOATING RUNTIME -->
<div id="runtime">
    <iframe src="https://turbowarp.org/1297244237/embed"
        allowfullscreen>
    </iframe>
</div>


<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();

const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","return","break","continue",
    "var","list","gvar"
];

function escapeHtml(text) {
    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

function highlight(text) {

    text = escapeHtml(text);

    const strings = [];
    const comments = [];

    let s = 0, c = 0;

    text = text.replace(/"((?:[^"\\]|\\.)*)"/g, m => {
        strings.push(m);
        return `__STR${s++}__`;
    });

    text = text.replace(/'((?:[^'\\]|\\.)*)'/g, m => {
        strings.push(m);
        return `__STR${s++}__`;
    });

    text = text.replace(/\/\*[\s\S]*?\*\//g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    text = text.replace(/\/\/.*/g, m => {
        comments.push(m);
        return `__COM${c++}__`;
    });

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m,o,mth) => `<span class="po">${o}</span>.<span class="po">${mth}</span>(`
    );

    text = text.replace(
        /\b(\d+|[a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
        (m,o,p) => `<span class="mo">${o}</span>.<span class="mo">${p}</span>`
    );

    text = text.replace(
        /\b([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
        (m,n) => KEYWORDS.includes(n) ? m : `<span class="fn">${n}</span>(`
    );

    for (const kw of KEYWORDS) {
        text = text.replace(new RegExp("\\b"+kw+"\\b","g"),
            `<span class="kw">${kw}</span>`);
    }

    text = text.replace(/\b\d+\b/g, m => `<span class="num">${m}</span>`);

    text = text.replace(/__COM(\d+)__/g,(m,i)=>
        `<span class="com">${comments[i]}</span>`);

    text = text.replace(/__STR(\d+)__/g,(m,i)=>
        `<span class="str">${strings[i]}</span>`);

    return text;
}

/* UI */
function updateHighlight() {
    document.getElementById("highlight").innerHTML =
        highlight(document.getElementById("editor").value);
}

document.getElementById("editor").addEventListener("input", updateHighlight);

/* buttons */
window.encodeCode = function () {
    document.getElementById("right").textContent =
        codec.encodeLines(document.getElementById("editor").value);
};

window.clearOut = () =>
    document.getElementById("right").textContent = "";

window.copyOutput = () =>
    navigator.clipboard.writeText(
        document.getElementById("right").textContent
    );

updateHighlight();
</script>

</body>
</html>
