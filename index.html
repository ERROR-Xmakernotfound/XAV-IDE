<!--
const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
-->
<!DOCTYPE html>
<html>
<head>
<title>XAV++ IDE</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon.png">
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: #0f172a;
    color: white;
    font-family: Consolas, monospace;
}

/* LEFT PANEL */
#left {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #1f2937;
}

/* OUTPUT PANEL */
#right {
    flex: 2;
    background: #0a0f1c;
    color: #000000;
    padding: 10px;
    overflow: auto;
    white-space: pre-wrap;
}

/* FLOATING RUNTIME */
#runtime {
    position: fixed;
    bottom: 5px;
    right: 10px;

    width: 637px;
    height: 600px;

    background: #000;
    border: 2px solid #1f2937;
    border-radius: 8px;

    overflow: hidden;
    z-index: 9999;
}

#runtime iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* CONTROLS */
#controls {
    padding: 12px 12px;
    margin: 10px 10px 6px 10px;
    background: #252947;
    border-radius: 6px;
    border-bottom: 4px solid #5f5957;
}
#editorMask {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 12px;

    background: #111827;
    z-index: 5;

    pointer-events: none;
}
button {
    background: #2563eb;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 5px;
}

/* EDITOR WRAPPER */
#editorWrap {
    position: relative;
    flex: 1;
    overflow: hidden;
}
#editorContainer {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
}

#editorWrap textarea,
#editorWrap pre {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 10px;

    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 20px;

    tab-size: 4;
    box-sizing: border-box;

    white-space: pre;   /* MUST be identical */
    overflow-wrap: normal;
    word-wrap: normal;
}

/* INPUT LAYER */
#editor {
    background: transparent;
    color: transparent;
    caret-color: white;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;

    overflow: auto;
    white-space: pre;   /* MUST match highlight exactly */
}

/* OUTPUT LAYER */
#highlight {
    z-index: 1;
    pointer-events: none;

    overflow: hidden;
    white-space: pre;   /* CRITICAL FIX */
}

/* FULL SIZE LOCK */
#editor,
#highlight {
    width: 100%;
    height: 100%;
}
#highlight {
    z-index: 1;
    pointer-events: none;

    white-space: pre;
    overflow: visible;

    will-change: transform;
}

/* SYNTAX COLORS */
.kw { color: #77b7ff; font-weight: bold; }
.str { color: #55aa55; }
.num { color: #72efdd; }
.com { color: #5c677d; }
.fn  { color: #ffaa55; }
.mo  { color: #ffb86b; }
.po  { color: #bd93f9; }
.bool { color: #ee2222; font-weight: bold; }
.builtin { color: #66ffcc; font-weight: bold; }
.err { background: rgba(255,0,0,0.18); border-bottom: 2px solid #ff4444; }
.paren { color: #ffffff; }
</style>
</head>

<body>

<!-- EDITOR -->
<div id="left">

    <div id="controls">
        <button onclick="clearOut()">Clear</button>
        <button onclick="encodeCode();copyOutput();alert('encoded output copied!');">
            Encode and Copy
        </button>
    </div>

    <div id="editorWrap">
        <div id="editorMask"></div>

        <pre id="highlight"></pre>
        <textarea id="editor">print("hello world");</textarea>
    </div>

</div>

<!-- OUTPUT -->
<div id="right"></div>

<!-- FLOATING RUNTIME -->
<div id="runtime">
    <iframe src="https://turbowarp.org/1297244237/embed"
        allowfullscreen>
    </iframe>
</div>


<script src="scratch_encoder.js"></script>

<script>
const codec = new EncodeDecode();

const KEYWORDS = [
    "if","elif","else","while","exec","clone",
    "func","loop","clone","return","break","continue",
    "var","list","gvar","upload","output","link"
];
const BUILTINS = [
    "$mouse_x",
    "$mouse_y",
    "$answer",
    "$x_pos",
    "$y_pos",
    "$direction",
    "$CloneID",
    "$input#",
    "$returned",
    "$namespace",
    "$in#",
    "$is_pressed",
];

function escapeHtml(text) {
    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}
function analyzeErrors(text) {

    const errors = [];

    const stack = [];

    const pairs = {
        "(": ")",
        "{": "}",
        "[": "]"
    };

let inString = false;
let stringStart = -1;

let inLineComment = false;
let inBlockComment = false;

    // =========================
    // BRACKET + STRING CHECKING
    // =========================

    for (let i = 0; i < text.length; i++) {

        const ch = text[i];
        const next = text[i + 1];

        // XAV++ escapes:
        // /" = literal "
        // // = literal /
        if (ch === "/" && (next === '"' || next === "/")) {
            i++;
            continue;
        }

        // STRING HANDLING
        if (ch === '"') {

            if (!inString) {
                inString = true;
                stringStart = i;
            } else {
                inString = false;
            }

            continue;
        }

        // ignore syntax inside strings
        if (inString) continue;

        // OPENING BRACKETS
        if (pairs[ch]) {

            stack.push({
                char: ch,
                pos: i
            });

            continue;
        }

        // CLOSING BRACKETS
        if (Object.values(pairs).includes(ch)) {

            const last = stack.pop();

            // nothing to match
            if (!last) {

                errors.push({
                    type: "bracket",
                    pos: i,
                    length: 1,
                    msg: `Unexpected '${ch}'`
                });

                continue;
            }

            // wrong bracket type
            if (pairs[last.char] !== ch) {

                errors.push({
                    type: "bracket",
                    pos: i,
                    length: 1,
                    msg: `Expected '${pairs[last.char]}' but got '${ch}'`
                });
            }
        }
    }

    // UNCLOSED BRACKETS
    for (const item of stack) {

        errors.push({
            type: "bracket",
            pos: item.pos,
            length: 1,
            msg: `Unclosed '${item.char}'`
        });
    }

    // UNCLOSED STRING
    if (inString) {

        errors.push({
            type: "string",
            pos: stringStart,
            length: 1,
            msg: "Unclosed string"
        });
    }

    // =========================
    // SEMICOLON CHECKING
    // =========================

    const lines = text.split("\n");

    let currentPos = 0;
    let blockDepth = 0;

    lines.forEach((line) => {

        const t = line.trim();

        // skip blank lines
        if (!t) {
            currentPos += line.length + 1;
            return;
        }

        // skip single-line comments
        if (t.startsWith("//")) {
            currentPos += line.length + 1;
            return;
        }

        // skip multiline comment markers
        if (
            t.startsWith("/*") ||
            t.endsWith("*/")
        ) {
            currentPos += line.length + 1;
            return;
        }

        // count blocks
        for (const ch of line) {

            if (ch === "{") blockDepth++;
            if (ch === "}") blockDepth--;
        }

        // opening block line
        const opensBlock = t.endsWith("{");

        // only require semicolon
        // if not mid-block
        if (!opensBlock && blockDepth <= 0) {

            if (!t.endsWith(";")) {

                errors.push({
                    type: "semicolon",
                    pos: currentPos + line.length - 1,
                    length: 1,
                    msg: "Missing semicolon"
                });
            }
        }

        currentPos += line.length + 1;
    });

    return errors;
}
function highlight(text) {

    let result = "";
    let i = 0;

    let inString = false;
    let stringChar = null;

    let inLineComment = false;
    let inBlockComment = false;

    const isKeyword = (w) => KEYWORDS.includes(w);

    let buffer = "";

    function flushBuffer() {

        if (!buffer) return;

        let out = buffer;

        if (/^\d+$/.test(out)) {
            result += `<span class="num">${out}</span>`;
        }

        else if (/^\$[a-zA-Z_][a-zA-Z0-9_]*$/.test(out)) {
            result += `<span class="builtin">${out}</span>`;
        }

        else if (isKeyword(out)) {
            result += `<span class="kw">${out}</span>`;
        }

        else {
            result += escapeHtml(out);
        }

        buffer = "";
    }

    while (i < text.length) {

        const ch = text[i];
        const next = text[i + 1];

        // =========================================================
        // IMPORTANT FIX: COMMENT MODE OVERRIDES EVERYTHING
        // =========================================================

        if (inLineComment) {

            result += `<span class="com">${escapeHtml(ch)}</span>`;

            if (ch === "\n") {
                inLineComment = false;
            }

            i++;
            continue;
        }

        if (inBlockComment) {

            if (ch === "*" && next === "/") {
                result += `<span class="com">*/</span>`;
                inBlockComment = false;
                i += 2;
                continue;
            }

            result += `<span class="com">${escapeHtml(ch)}</span>`;
            i++;
            continue;
        }

        // =========================================================
        // STRING MODE (ONLY IF NOT IN COMMENT)
        // =========================================================

        if (inString) {

            result += `<span class="str">${escapeHtml(ch)}</span>`;

            if (ch === stringChar) {
                inString = false;
                stringChar = null;
            }

            i++;
            continue;
        }

        // =========================================================
        // START COMMENT (highest priority)
        // =========================================================

        if (ch === "/" && next === "/") {
            flushBuffer();
            inLineComment = true;
            result += `<span class="com">//</span>`;
            i += 2;
            continue;
        }

        if (ch === "/" && next === "*") {
            flushBuffer();
            inBlockComment = true;
            result += `<span class="com">/*</span>`;
            i += 2;
            continue;
        }

        // =========================================================
        // START STRING
        // =========================================================

        if (ch === '"' || ch === "'") {
            flushBuffer();
            inString = true;
            stringChar = ch;
            result += `<span class="str">${ch}</span>`;
            i++;
            continue;
        }

        // =========================================================
        // WORDS (keywords, functions, builtins)
        // =========================================================

        if (/[a-zA-Z_]/.test(ch)) {

            buffer += ch;
            i++;

            while (i < text.length &&
                   /[a-zA-Z0-9_$]/.test(text[i])) {
                buffer += text[i];
                i++;
            }

            // function detection
            if (text[i] === "(" && !isKeyword(buffer)) {
                result += `<span class="fn">${buffer}</span>`;
                buffer = "";
                continue;
            }

            flushBuffer();
            continue;
        }

        // =========================================================
        // NUMBERS
        // =========================================================

        if (/\d/.test(ch)) {

            buffer += ch;
            i++;

            while (i < text.length && /\d/.test(text[i])) {
                buffer += text[i];
                i++;
            }

            flushBuffer();
            continue;
        }
        

        // =========================================================
        // PARENTHESIS
        // =========================================================

        if (ch === "(" || ch === ")") {
            flushBuffer();
            result += `<span class="paren">${ch}</span>`;
            i++;
            continue;
        }

        // =========================================================
        // DEFAULT CHARACTER
        // =========================================================

        flushBuffer();
        result += escapeHtml(ch);
        i++;
    }

    flushBuffer();
// =========================
// DOT SYSTEM (SAFE VERSION)
// =========================

// protect existing spans first
const spans = [];
let s = 0;

result = result.replace(/<span[^>]*>.*?<\/span>/g, m => {
    spans.push(m);
    return `__SPAN${s++}__`;
});

// -------------------------
// POLY FIRST
// -------------------------
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\s*\(/g,
    (m, obj, prop) => {
        return `<span class="po">${obj}.${prop}</span><span class="paren">(</span>`;
    }
);

// -------------------------
// MONO SECOND
// -------------------------
result = result.replace(
    /\b([a-zA-Z_][a-zA-Z0-9_]*)\.([a-zA-Z_][a-zA-Z0-9_]*)\b/g,
    (m, obj, prop) => {
        return `<span class="mo">${obj}.${prop}</span>`;
    }
);

// restore spans
result = result.replace(/__SPAN(\d+)__/g, (m, i) => spans[i]);
    return result;
}
const editor = document.getElementById("editor");
const highlightBox = document.getElementById("highlight");

editor.addEventListener("scroll", () => {
    highlightBox.style.transform =
        `translate(${-editor.scrollLeft}px, ${-editor.scrollTop}px)`;
});
editor.addEventListener("keydown", (e) => {

    const TAB_SIZE = 4;

    // =====================
    // TAB
    // =====================

    if (e.key === "Tab") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const spaces = " ".repeat(TAB_SIZE);

        editor.value =
            editor.value.substring(0, start) +
            spaces +
            editor.value.substring(end);

        editor.selectionStart =
        editor.selectionEnd =
            start + TAB_SIZE;

        updateHighlight();
    }

    // =====================
    // BACKSPACE TAB DELETE
    // =====================

    if (e.key === "Backspace") {

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        if (start === end) {

            const before =
                editor.value.substring(0, start);

            if (
                before.endsWith(
                    " ".repeat(TAB_SIZE)
                )
            ) {

                e.preventDefault();

                editor.value =
                    editor.value.substring(0, start - TAB_SIZE) +
                    editor.value.substring(end);

                editor.selectionStart =
                editor.selectionEnd =
                    start - TAB_SIZE;

                updateHighlight();
            }
        }
    }

    // =====================
    // AUTO INDENT
    // =====================

    if (e.key === "Enter") {

        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        const beforeCursor =
            editor.value.substring(0, start);

        const lineStart =
            beforeCursor.lastIndexOf("\n") + 1;

        const currentLine =
            beforeCursor.substring(lineStart);

        // existing indent
        const indent =
            currentLine.match(/^ */)[0];

        // add extra indent after {
        let extra = "";

        if (currentLine.trim().endsWith("{")) {

            extra =
                " ".repeat(TAB_SIZE);
        }

        const insert =
            "\n" + indent + extra;

        editor.value =
            editor.value.substring(0, start) +
            insert +
            editor.value.substring(end);

        const newPos =
            start + insert.length;

        editor.selectionStart =
        editor.selectionEnd =
            newPos;

        updateHighlight();
    }
});
function updateHighlight() {
    highlightBox.innerHTML =
    highlight(editor.value);
}
editor.addEventListener("input", updateHighlight);

/* buttons */
window.encodeCode = function () {
    document.getElementById("right").textContent =
        codec.encodeLines(document.getElementById("editor").value);
};

window.clearOut = () =>
    document.getElementById("right").textContent = "";

window.copyOutput = () =>
    navigator.clipboard.writeText(
        document.getElementById("right").textContent
    );

updateHighlight();
</script>

</body>
</html>
